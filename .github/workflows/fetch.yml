name: Fetch images
on:
  push:
    branches: [data-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 tools/fetch_images.py img_out
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd img_out && zip -q -r ../images.zip . && cd ..
          ls -la images.zip
          gh release delete data-img -y --cleanup-tag || true
          gh release create data-img images.zip --title "data-img" --notes "candidati foto" --prerelease
