name: Build APK

on:
  push:
    branches: [main, feat/aurora-approved-redesign, feat/aurora-layout-polish, feat/recipe-editorial-photos]
  workflow_dispatch:
    inputs:
      publish_existing_run:
        description: 'Pubblica solo l’APK verificato della build 40220576079 (lascia vuoto per compilare)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.publish_existing_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Modello AI offline (classificatore alimentare Google AIY food V1, TFLite con etichette incorporate).
      - name: Verify original functions and assets
        run: |
          python3 scripts/verify-aurora-boundary.py
          python3 tools/photography/verify.py

      - name: Download offline food model
        run: |
          set +e
          mkdir -p app/src/main/assets
          OUT=app/src/main/assets/food.tflite
          try() { curl -fsSL --retry 2 -o "$2" "$1" && [ "$(stat -c%s "$2")" -gt 1000000 ]; }
          if try "https://storage.googleapis.com/tfhub-lite-models/google/lite-model/aiy/vision/classifier/food_V1/1.tflite" "$OUT"; then echo ok
          elif try "https://tfhub.dev/google/lite-model/aiy/vision/classifier/food_V1/1?lite-format=tflite" "$OUT"; then echo ok
          else echo "::warning::Modello offline non scaricato: build senza AI offline"; rm -f "$OUT"; fi
          if [ -f "$OUT" ] && ! unzip -l "$OUT" 2>/dev/null | grep -Eiq '\.(txt|csv)'; then rm -f "$OUT"; fi
          exit 0

      # La chiave di firma è nel repo solo cifrata: si decifra con il secret SIGNING_PASS.
      - name: Decrypt signing key
        env:
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}
        run: |
          if [ -z "$SIGNING_PASS" ]; then echo "::error::Manca il secret SIGNING_PASS"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/jarvisfood.jks.enc -out app/jarvisfood.jks -pass env:SIGNING_PASS

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK + unit test
        id: compile
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew assembleRelease testReleaseUnitTest assembleDebug assembleDebugAndroidTest 2>&1 | tee build.log
          CODE=${PIPESTATUS[0]}
          # Risultati dei test (stampe incluse) come annotazione leggibile.
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          lines = []
          for f in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              r = ET.parse(f).getroot()
              lines.append(f"{r.get('name')}: {r.get('tests')} test, {r.get('failures')} falliti, {r.get('errors')} errori")
              for tc in r.findall("testcase"):
                  for fl in tc.findall("failure") + tc.findall("error"):
                      lines.append(f"FALLITO {tc.get('name')}: {(fl.get('message') or '')[:400]}")
              so = r.find("system-out")
              if so is not None and so.text: lines += [l for l in so.text.splitlines() if l.startswith("[")]
          if lines:
              msg = "%0A".join(l.replace("%", "%25") for l in lines)
              print(f"::notice title=Unit test::{msg}")
          PY
          if [ $CODE -ne 0 ]; then
            { grep -E "^e: |error:|What went wrong|FAILED|AssertionError|requires|Dependency" -A4 build.log | sed "s|file:///home/runner/work/jarvis-food-android/jarvis-food-android/app/src/main/java/com/jarvis/food/||" | head -150; } > errs.txt
            MSG=$(sed -e 's/%/%25/g' errs.txt | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build fallita::$MSG"
            exit $CODE
          fi

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/JarvisFood-v1.0.${{ github.run_number }}.apk"
          ls -la dist

      # Verifica visiva: avvia l'app su un emulatore Android 10 con dati dimostrativi e salva gli screenshot.
      - name: Enable KVM
        run: |
          # The 3 GB compiler daemon is no longer needed; free memory before the emulator.
          ./gradlew --stop
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Android 15 layout and enlarged text
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 3072M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            # The Google SDK setup app can ANR over the test activity on a fresh image.
            # These emulator-only settings keep first-run setup from stealing IME focus.
            adb shell settings put global device_provisioned 1
            adb shell settings put secure user_setup_complete 1
            adb shell pm disable-user --user 0 com.google.android.googlesdksetup || true
            adb shell am force-stop com.google.android.googlesdksetup || true
            adb shell pm disable-user --user 0 com.google.android.setupwizard || true
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb install -r -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # Clear a launcher ANR left over from first boot, before testing the app.
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb logcat -c
            adb shell settings put secure show_ime_with_hard_keyboard 1
            KEYBOARD=$(adb shell ime list -s | head -1 | tr -d '\r')
            if [ -n "$KEYBOARD" ]; then adb shell ime enable "$KEYBOARD"; adb shell ime set "$KEYBOARD"; fi
            adb shell am instrument -w -e captureName standard -e class com.jarvis.food.AuroraLayoutTest com.jarvis.food.test/androidx.test.runner.AndroidJUnitRunner > layout-standard.log 2>&1
            cat layout-standard.log
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.threebutton
            adb shell am instrument -w -e captureName buttons -e navigationMode 0 -e class com.jarvis.food.BottomActionInsetsTest com.jarvis.food.test/androidx.test.runner.AndroidJUnitRunner > layout-buttons.log 2>&1
            cat layout-buttons.log
            adb shell wm size 1080x2340
            adb shell wm density 480
            adb shell settings put system font_scale 1.3
            adb shell am instrument -w -e captureName large-text -e class com.jarvis.food.AuroraLayoutTest com.jarvis.food.test/androidx.test.runner.AndroidJUnitRunner > layout-large-text.log 2>&1
            cat layout-large-text.log
            adb shell am instrument -w -e captureName buttons-large-text -e navigationMode 0 -e class com.jarvis.food.BottomActionInsetsTest com.jarvis.food.test/androidx.test.runner.AndroidJUnitRunner > layout-buttons-large-text.log 2>&1
            cat layout-buttons-large-text.log
            adb exec-out run-as com.jarvis.food tar cf - files/shots > layout-shots.tar
            adb logcat -d -s AndroidRuntime:E > layout-crash.txt
            adb shell settings put system font_scale 1.0
            adb shell wm size reset
            adb shell wm density reset
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.gestural
            adb shell am instrument -w -e captureName gestures -e navigationMode 2 -e class com.jarvis.food.BottomActionInsetsTest com.jarvis.food.test/androidx.test.runner.AndroidJUnitRunner > layout-gestures.log 2>&1
            cat layout-gestures.log
            adb exec-out run-as com.jarvis.food tar cf - files/shots > layout-shots.tar
            if grep -q "FATAL EXCEPTION" layout-crash.txt; then cat layout-crash.txt; exit 1; fi
            # Switching navigation overlays can briefly reconnect the emulator's adb transport.
            timeout 90 adb wait-for-device
            adb shell true
            adb shell am instrument -w -e class com.jarvis.food.PhotoAiFlowTest com.jarvis.food.test/androidx.test.runner.AndroidJUnitRunner > photo-ai.log 2>&1 || { if grep -Eq "device offline|device.*not found" photo-ai.log; then adb kill-server; adb start-server; timeout 90 adb wait-for-device; adb shell am instrument -w -e class com.jarvis.food.PhotoAiFlowTest com.jarvis.food.test/androidx.test.runner.AndroidJUnitRunner > photo-ai.log 2>&1; else cat photo-ai.log; exit 1; fi; }
            cat photo-ai.log
            adb logcat -d -s AndroidRuntime:E > layout-crash.txt
            if grep -q "FATAL EXCEPTION" layout-crash.txt; then cat layout-crash.txt; exit 1; fi
            grep -q "OK (2 tests)" layout-standard.log
            grep -q "OK (2 tests)" layout-large-text.log
            grep -q "OK (1 test)" layout-buttons.log
            grep -q "OK (1 test)" layout-buttons-large-text.log
            grep -q "OK (1 test)" layout-gestures.log
            grep -q "OK (3 tests)" photo-ai.log
            adb shell am instrument -w -e captureName standard -e class com.jarvis.food.TrainingDiaryFlowTest com.jarvis.food.test/androidx.test.runner.AndroidJUnitRunner > layout-features-standard.log 2>&1
            cat layout-features-standard.log
            grep -q "OK (2 tests)" layout-features-standard.log
            adb shell settings put system font_scale 1.3
            adb shell am instrument -w -e captureName large-text -e class com.jarvis.food.TrainingDiaryFlowTest com.jarvis.food.test/androidx.test.runner.AndroidJUnitRunner > layout-features-large-text.log 2>&1
            cat layout-features-large-text.log
            grep -q "OK (2 tests)" layout-features-large-text.log
            adb shell settings put system font_scale 1.0
            adb exec-out run-as com.jarvis.food tar cf - files/shots > layout-shots.tar
            adb logcat -d -s AndroidRuntime:E > layout-crash.txt
            if grep -q "FATAL EXCEPTION" layout-crash.txt; then cat layout-crash.txt; exit 1; fi

      - name: Emulator screenshots
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        id: emu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_5
          ram-size: 3072M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb install -r -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.jarvis.food.AuroraRegressionTest com.jarvis.food.test/androidx.test.runner.AndroidJUnitRunner > regression.log 2>&1
            cat regression.log
            grep -q "OK (3 tests)" regression.log
            adb shell am instrument -w -e class com.jarvis.food.ScreenshotTest com.jarvis.food.test/androidx.test.runner.AndroidJUnitRunner > emu.log 2>&1 || true
            grep -E "FAIL|Exception|Error|at com.jarvis" emu.log | head -60 > emu_err.txt || true
            # ScreenshotTest clears files/shots; capture dedicated footer evidence afterwards.
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.threebutton
            adb shell am instrument -w -e captureName android10-buttons -e navigationMode 0 -e class com.jarvis.food.BottomActionInsetsTest com.jarvis.food.test/androidx.test.runner.AndroidJUnitRunner > layout-android10-buttons.log 2>&1
            cat layout-android10-buttons.log
            grep -q "OK (1 test)" layout-android10-buttons.log
            adb exec-out run-as com.jarvis.food tar cf - files/shots > shots.tar || true
            adb logcat -d -s AndroidRuntime:E > crash.txt || true
            if grep -q "FATAL EXCEPTION" crash.txt; then cat crash.txt; exit 1; fi
            grep -q "OK (1 test)" emu.log

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" dist/*.apk \
            --title "Jarvis Food v1.0.${{ github.run_number }}" \
            --notes "APK firmato, pronto da installare. Build #${{ github.run_number }} del commit ${GITHUB_SHA::7}."

      - name: Save APK and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-APK-and-QA-${{ github.run_number }}
          path: |
            dist/*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/test-results/**/*.xml
            regression.log
            emu.log
            crash.txt
            shots.tar
            layout-*.log
            layout-shots.tar
            layout-crash.txt
            photo-ai.log
          retention-days: 14

      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [ -s emu_err.txt ]; then MSG=$(sed -e 's/%/%25/g' emu_err.txt | sed -e ':a;N;$!ba;s/\n/%0A/g'); echo "::warning title=Test emulatore::$MSG"; fi
          if [ -s crash.txt ]; then MSG=$(head -40 crash.txt | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g'); echo "::warning title=Crash::$MSG"; fi
          mkdir -p shots && tar xf shots.tar -C shots 2>/dev/null
          if [ -s layout-shots.tar ]; then tar xf layout-shots.tar -C shots; fi
          N=$(find shots -name "*.png" | wc -l); echo "::notice title=Screenshot::$N screenshot"
          if [ "$N" -gt 0 ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then cd shots && zip -q -r ../screenshots.zip . && cd .. && gh release upload "v1.0.${{ github.run_number }}" screenshots.zip --clobber; fi
          exit 0

  publish_verified_apk:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_existing_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate existing successful build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN: ${{ inputs.publish_existing_run }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          assert os.environ['SOURCE_RUN'] == '40220576079'
          run = json.loads(subprocess.check_output(['gh', 'api', 'repos/IMSLEPT/jarvis-food-android/actions/runs/40220576079']))
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['run_number'] == 93
          assert run['head_sha'] == 'ca86f55a86dce687612af35940bdee84f149b3af'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: Aurora-APK-and-QA-93
          path: qa
          repository: IMSLEPT/jarvis-food-android
          run-id: 40220576079
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact APK and packaged photographs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess, zipfile
          import xml.etree.ElementTree as ET
          apk = Path('qa/dist/JarvisFood-v1.0.93.apk')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          assert digest == json.loads(Path('docs/APK-1.0.93-verification.json').read_text())['sha256']
          records = json.loads(subprocess.check_output(['git', 'show', 'ca86f55a86dce687612af35940bdee84f149b3af:tools/photography/approved.json']))
          paths = {r['asset'] for r in records.values()}
          assert len(records) == 763 and len(paths) == 435
          with zipfile.ZipFile(apk) as z:
              assert {n for n in z.namelist() if n.startswith('assets/photography/') and n.endswith('.webp')} == {'assets/' + p for p in paths}
              for record in records.values():
                  assert hashlib.sha256(z.read('assets/' + record['asset'])).hexdigest() == record['sha256']
              assert len(z.read('assets/food.tflite')) > 1000000
          totals = {k: 0 for k in ('tests', 'failures', 'errors', 'skipped')}
          for path in Path('qa/app/build/test-results/testReleaseUnitTest').glob('TEST-*.xml'):
              suite = ET.parse(path).getroot()
              for k in totals: totals[k] += int(suite.get(k, 0))
          assert totals == dict(tests=70, failures=0, errors=0, skipped=0), totals
          for name, count in [('layout-standard.log', 2), ('layout-large-text.log', 2), ('photo-ai.log', 3), ('regression.log', 3), ('emu.log', 1), ('layout-buttons.log', 1), ('layout-buttons-large-text.log', 1), ('layout-gestures.log', 1), ('layout-android10-buttons.log', 1)]:
              assert f'OK ({count} test' in Path('qa', name).read_text()
          apk.with_suffix('.apk.sha256').write_text(digest + '  ' + apk.name + '\n')
          print('APK originale verificato: 435 immagini, 763 abbinamenti, 70 test unitari e 15 test Android.')
          PY
      - name: Publish verified snapshot without recompiling
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.93 qa/dist/JarvisFood-v1.0.93.apk qa/dist/JarvisFood-v1.0.93.apk.sha256
