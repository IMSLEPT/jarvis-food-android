name: Jarvis Food 233 build and visual verification
on:
  push:
    branches: [qa/proporzioni-premium-233]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the approved offline model and signing configuration
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}
        run: |
          mkdir baseline dist
          gh release download preview-v1.0.231-redesign -p 'JarvisFood-v1.0.231.apk' -D baseline
          unzip -p baseline/JarvisFood-v1.0.231.apk assets/food.tflite > app/src/main/assets/food.tflite
          test -s app/src/main/assets/food.tflite
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/jarvisfood.jks.enc -out app/jarvisfood.jks -pass env:SIGNING_PASS
      - name: Compile and verify the signed APK
        run: |
          python3 scripts/verify-aurora-boundary.py
          python3 tools/photography/verify.py
          GITHUB_RUN_NUMBER=233 ./gradlew assembleRelease testReleaseUnitTest --console=plain
          python3 - <<'TEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          rows = [ET.parse(p).getroot() for p in Path('app/build/test-results/testReleaseUnitTest').glob('TEST-*.xml')]
          assert rows
          print(*(f"{key}={sum(int(x.get(key, 0)) for x in rows)}" for key in ('tests','failures','errors','skipped')), file=open('dist/unit-tests.txt','w'))
          TEST
          cp app/build/outputs/apk/release/app-release.apk dist/JarvisFood-v1.0.233.apk
          tool=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$tool" verify --print-certs baseline/JarvisFood-v1.0.231.apk > baseline/certificate.txt
          "$tool" verify --print-certs dist/JarvisFood-v1.0.233.apk > dist/certificate.txt
          diff -u baseline/certificate.txt dist/certificate.txt
          "$(dirname "$tool")/aapt" dump badging dist/JarvisFood-v1.0.233.apk > dist/manifest-version.txt
          grep -q "name='com.jarvis.food' versionCode='233' versionName='1.0.233'" dist/manifest-version.txt
          (cd dist && sha256sum *.apk > SHA256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: JarvisFood-v1.0.233-signed
          path: dist/
          if-no-files-found: error
  android:
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            target: google_apis
            font: '1.0'
            profile: standard
          - api: 29
            target: default
            font: '1.3'
            profile: large-text
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the approved offline model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download preview-v1.0.231-redesign -p 'JarvisFood-v1.0.231.apk' -D /tmp/premium-base
          unzip -p /tmp/premium-base/JarvisFood-v1.0.231.apk assets/food.tflite > app/src/main/assets/food.tflite
          test -s app/src/main/assets/food.tflite
      - name: Build instrumentation APKs
        run: |
          GITHUB_RUN_NUMBER=233 ./gradlew assembleDebug assembleDebugAndroidTest --console=plain
          ./gradlew --stop
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_5
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p evidence
            if [ "${{ matrix.api }}" = 29 ]; then adb root; timeout 60 adb wait-for-device; adb shell setprop dalvik.vm.heapgrowthlimit 256m; adb shell setprop dalvik.vm.heapsize 512m; adb shell stop; adb shell start; timeout 90 bash -c 'until adb shell service check settings 2>/dev/null | grep -q found && adb shell pm list packages android 2>/dev/null | grep -q package:android; do sleep 1; done'; fi
            adb shell settings put global device_provisioned 1
            adb shell settings put secure user_setup_complete 1
            adb shell pm disable-user --user 0 com.google.android.googlesdksetup || true
            adb shell pm disable-user --user 0 com.google.android.setupwizard || true
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell settings put global anr_show_background 0
            adb shell input keyevent 82
            adb shell wm size 1080x2340
            adb shell wm density 420
            adb shell settings put system font_scale ${{ matrix.font }}
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk | tee evidence/install-app.log
            adb install -r -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk | tee evidence/install-test.log
            adb shell am start -W -n com.jarvis.food/.MainActivity
            adb logcat -c
            adb shell am instrument -w -e captureName ${{ matrix.profile }} -e class com.jarvis.food.TodayRefinementTest,com.jarvis.food.RedesignNovemberTest,com.jarvis.food.TodayDashboardTest,com.jarvis.food.VisualConsistencyTest#diaryMenuAndKitchenKeepSecondaryActionsReachable com.jarvis.food.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/android-tests.log
            adb exec-out run-as com.jarvis.food tar cf - files/shots > evidence/screenshots.tar
            adb logcat -d -s AndroidRuntime:E > evidence/runtime.log
            grep -q 'OK (' evidence/android-tests.log
            if grep -q 'FATAL EXCEPTION' evidence/runtime.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-food-android-${{ matrix.profile }}
          path: evidence/
  upgrade:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JarvisFood-v1.0.232-signed
          run-id: '42196826387'
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          name: JarvisFood-v1.0.233-signed
          path: candidate
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p evidence
            adb shell settings put global device_provisioned 1
            adb shell settings put secure user_setup_complete 1
            adb install baseline/JarvisFood-v1.0.232.apk | tee evidence/install-baseline.log
            adb shell dumpsys package com.jarvis.food | grep versionName=1.0.232
            adb shell am start -W -n com.jarvis.food/.MainActivity | tee evidence/baseline-launch.log
            adb install -r candidate/JarvisFood-v1.0.233.apk | tee evidence/install-upgrade.log
            adb shell dumpsys package com.jarvis.food | grep versionName=1.0.233
            adb logcat -c
            adb shell am start -W -n com.jarvis.food/.MainActivity | tee evidence/candidate-launch.log
            adb shell pidof com.jarvis.food | tee evidence/pid.log
            adb logcat -d -s AndroidRuntime:E > evidence/runtime.log
            grep -q Success evidence/install-upgrade.log
            grep -q 'Status: ok' evidence/candidate-launch.log
            test -s evidence/pid.log
            if grep -q 'FATAL EXCEPTION' evidence/runtime.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-food-signed-upgrade
          path: evidence/
