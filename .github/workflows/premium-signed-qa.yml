name: Jarvis Food premium signed APK
on:
  push:
    branches: [qa/premium-ui-2026-11-06]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the approved offline model and signing configuration
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}
        run: |
          mkdir baseline dist
          gh release download preview-v1.0.231-redesign -p 'JarvisFood-v1.0.231.apk' -D baseline
          unzip -p baseline/JarvisFood-v1.0.231.apk assets/food.tflite > app/src/main/assets/food.tflite
          test -s app/src/main/assets/food.tflite
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/jarvisfood.jks.enc -out app/jarvisfood.jks -pass env:SIGNING_PASS
      - name: Compile and verify the signed APK
        env:
          GITHUB_RUN_NUMBER: '232'
        run: |
          python3 scripts/verify-aurora-boundary.py
          python3 tools/photography/verify.py
          ./gradlew assembleRelease testReleaseUnitTest --console=plain
          cp app/build/outputs/apk/release/app-release.apk dist/JarvisFood-v1.0.232.apk
          tool=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$tool" verify --print-certs baseline/JarvisFood-v1.0.231.apk > baseline/certificate.txt
          "$tool" verify --print-certs dist/JarvisFood-v1.0.232.apk > dist/certificate.txt
          diff -u baseline/certificate.txt dist/certificate.txt
          (cd dist && sha256sum *.apk > SHA256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: JarvisFood-v1.0.232-signed
          path: dist/
          if-no-files-found: error
