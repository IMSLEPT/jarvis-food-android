name: Prova chatbot (Gemma sul telefono)

# Avvio manuale: scarica Gemma 4 E2B (2,6 GB), lo carica con LiteRT-LM su un emulatore e verifica che il chatbot funzioni davvero.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug + test strumentati
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Scarica Gemma 4 E2B
        run: |
          curl -fL --retry 4 --retry-delay 5 -o model.litertlm \
            https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it.litertlm
          ls -la model.litertlm
          test "$(stat -c%s model.litertlm)" = "2588147712"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Chatbot su emulatore
        id: emu
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          ram-size: 5120M
          heap-size: 1024M
          disk-size: 14G
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb install -r -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb push model.litertlm /data/local/tmp/model.litertlm
            adb shell "run-as com.jarvis.food mkdir -p files/models"
            adb shell "cat /data/local/tmp/model.litertlm | run-as com.jarvis.food sh -c 'cat > files/models/gemma-4-E2B-it.litertlm'"
            adb shell "rm /data/local/tmp/model.litertlm"
            adb shell "run-as com.jarvis.food ls -la files/models"
            adb shell am instrument -w -e class com.jarvis.food.ChatLlmTest com.jarvis.food.test/androidx.test.runner.AndroidJUnitRunner > chat_emu.log 2>&1 || true
            adb exec-out run-as com.jarvis.food cat files/chat_results.txt > chat_results.txt || true
            adb logcat -d -s AndroidRuntime:E libc:F DEBUG:F > chat_crash.txt || true

      - name: Risultati
        if: always()
        run: |
          set +e
          echo "---- chat_results.txt"; cat chat_results.txt
          echo "---- chat_emu.log (coda)"; tail -40 chat_emu.log
          echo "---- crash"; head -60 chat_crash.txt
          MSG=$( { cat chat_results.txt; echo "--- instrument:"; grep -E "OK \(|FAILURES|Tests run|Process crashed|UnsatisfiedLink" chat_emu.log; echo "--- crash:"; head -25 chat_crash.txt; } | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Chatbot::$MSG"
          exit 0
