name: Focused food UI diagnostics
on:
  push:
    branches: [debug/food-ui-2026-11-01-167]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile native debug app and tests
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Focused native Android 15 checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 3072M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put global device_provisioned 1
            adb shell settings put secure user_setup_complete 1
            adb shell pm disable-user --user 0 com.google.android.googlesdksetup || true
            adb shell am force-stop com.google.android.googlesdksetup || true
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb install -r -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell settings put system font_scale 1.0
            adb logcat -G 16M
            adb logcat -c
            adb shell am instrument -w -e captureName focused -e class com.jarvis.food.AuroraLayoutTest#barsGreetingsAndLongActionsRemainVisible com.jarvis.food.test/androidx.test.runner.AndroidJUnitRunner > keyboard.log 2>&1
            adb logcat -d > keyboard-system.log
            adb shell dumpsys input_method > keyboard-state.log
            adb exec-out run-as com.jarvis.food tar cf - files/shots > layout-shots.tar
            adb shell am instrument -w -e captureName focused -e class com.jarvis.food.TrainingDiaryFlowTest#targetsCanBeConfiguredOverriddenAndDisabledWithoutLosingLegacyGoals com.jarvis.food.test/androidx.test.runner.AndroidJUnitRunner > day-type.log 2>&1
            adb exec-out run-as com.jarvis.food tar cf - files/shots > layout-shots.tar
            adb shell am instrument -w -e captureName focused -e class com.jarvis.food.VisualConsistencyTest com.jarvis.food.test/androidx.test.runner.AndroidJUnitRunner > requested-features.log 2>&1
            adb logcat -d > focused-system.log
            adb exec-out run-as com.jarvis.food tar cf - files/shots > layout-shots.tar
            cat keyboard.log
            cat day-type.log
            cat requested-features.log
            grep -q "OK (1 test)" keyboard.log
            grep -q "OK (1 test)" day-type.log
            grep -q "OK (3 tests)" requested-features.log
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-ui-diagnostics
          path: |
            *.log
            layout-shots.tar
          retention-days: 7
