name: Package premium Android delivery
on:
  push:
    branches: [delivery/premium-227]
    paths: [scripts/package-premium-delivery.py, .github/workflows/package-premium-delivery.yml, reports/premium-227-visual-verdict.json]
concurrency:
  group: package-premium-227
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow reportlab pypdfium2
      - name: Verify Android evidence and prepare screenshot comparisons
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_RUN: '41928404591'
          ANDROID_SHA: 6aa999e8d7d4bfda4e03d56f982963b18bd6c710
        run: python scripts/package-premium-delivery.py
      - name: Publish compared screenshots and verification files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload preview-v1.0.227-redesign delivery/* --clobber
      - name: Retain comparison PDF and native inspection images
        run: |
          mkdir -p reports/images
          cp delivery/JarvisFood-v1.0.227-Prima-Dopo.pdf reports/
          cp delivery/confronto-*.png reports/images/
          cp delivery/pdf-preview-*.png reports/images/
          cp delivery-work/final/shots/files/shots/whole-large-text/settings-watch-bottom.png reports/images/watch-text130.png
          cp delivery-work/final/shots/files/shots/whole-large-text/settings-backup-bottom.png reports/images/backup-text130.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --force reports/JarvisFood-v1.0.227-Prima-Dopo.pdf reports/images reports/visual-encoded
          if ! git diff --cached --quiet; then
            git commit -m 'Retain actual Android comparison artifacts [skip ci]'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Premium-delivery-227
          path: delivery/
