name: Fetch free photos
on:
  push:
    branches: [data-photos]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: |
          if [ -z "$PIXABAY_KEY" ]; then echo "::warning::PIXABAY_KEY assente"; else echo "::notice::PIXABAY_KEY presente (${#PIXABAY_KEY} caratteri)"; fi
          timeout 50m python3 tools/fetch_photos.py out || true
          echo "::notice::$(ls out/*.jpg 2>/dev/null | wc -l) immagini, log: $(head -c 600 out/log.txt | tr '\n' ' ')"
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out && zip -q -r ../photos.zip . && cd ..
          gh release delete data-photos -y --cleanup-tag || true
          gh release create data-photos photos.zip --title "data-photos" --notes "foto candidate" --prerelease
