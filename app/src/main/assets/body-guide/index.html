<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'unsafe-inline';style-src 'unsafe-inline';connect-src 'none'"><title>Guida corporea 3D</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef3fb;font-family:system-ui;color:#09194d}body{background:radial-gradient(ellipse at 50% 34%,#fff 8%,#ecf2fe 90%)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}.shadow{position:absolute;bottom:4%;left:30%;width:40%;height:5%;border-radius:50%;background:radial-gradient(ellipse,#09194d23,transparent 70%);pointer-events:none}#label{position:absolute;bottom:8px;left:8px;right:8px;text-align:center;pointer-events:none;font-size:12px;color:#4f5b78}#error{display:none;padding:28px;line-height:1.6;text-align:center}button{position:absolute;top:10px;border:1px solid #d7ddea;background:#ffffffec;color:#09194d;border-radius:14px;min-width:48px;min-height:44px;padding:8px 12px;font-weight:600}#front{left:10px}#back{right:10px}button:focus{outline:2px solid #ea7138}</style>
<div class="shadow"></div><canvas id="model" role="img" aria-label="Corpo tridimensionale ruotabile con zona di misurazione evidenziata"></canvas><button id="front" aria-label="Vista anteriore">Fronte</button><button id="back" aria-label="Vista posteriore">Retro</button><div id="label">Trascina in orizzontale per ruotare · tocca una zona</div><div id="error">Il modello 3D non è disponibile su questo dispositivo. Puoi scegliere la zona dai pulsanti e seguire la guida qui sotto.</div>
<script>
'use strict';
const keys=['','vita','fianchi','petto','braccio','coscia','collo','grasso'];
const canvas=document.getElementById('model');let gl=canvas.getContext('webgl',{alpha:true,antialias:true,preserveDrawingBuffer:true});
let selected=1,yaw=0,female=false,meshes=[],ring=null,program,buffer,normalBuffer,indexBuffer,ready=false;
window.bodyState={ready:false,selected:'vita',triangles:0,angle:0};
function report(ok){try{AndroidBody.renderState(ok)}catch(e){}}
function fail(){canvas.style.display='none';document.getElementById('error').style.display='block';document.getElementById('label').style.display='none';report(false)}
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
function init(){
 if(!gl){fail();return}
 try{
 program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec3 aP;attribute vec3 aN;uniform float uYaw;uniform float uAspect;varying vec3 vN;varying vec3 vP;void main(){float c=cos(uYaw),s=sin(uYaw);mat3 r=mat3(c,0.,-s,0.,1.,0.,s,0.,c);vec3 p=r*aP;vN=r*aN;vP=aP;gl_Position=vec4(p.x/(1.86*uAspect),(p.y-.04)/1.86,-p.z/6.,1.);}'));
 gl.attachShader(program,shader(gl.FRAGMENT_SHADER,'precision mediump float;varying vec3 vN;varying vec3 vP;uniform vec3 uColor;uniform float uId;uniform float uPick;uniform float uSelected;uniform float uRing;void main(){float zone=uId;if(uId==8.){zone=vP.y>.52?3.:(vP.y>.12?1.:2.);}if(uPick>0.5){gl_FragColor=vec4(zone/255.,0.,0.,1.);return;}vec3 n=normalize(vN);float light=.48+.42*max(0.,dot(n,normalize(vec3(-.55,.8,1.))));float rim=pow(1.-abs(n.z),3.)*.12;vec3 col=uColor;bool band=(uId==8.&&uSelected==1.&&abs(vP.y-.34)<.038)||(uId==8.&&uSelected==2.&&abs(vP.y+.075)<.038)||(uId==8.&&uSelected==3.&&abs(vP.y-.77)<.038)||(uSelected==4.&&uId==4.&&vP.x<0.&&abs(vP.y-.76)<.05)||(uSelected==5.&&uId==5.&&vP.x<0.&&abs(vP.y+.54)<.04)||(uSelected==6.&&uId==6.&&abs(vP.y-1.19)<.035);if(band||uSelected==7.)col=mix(col,vec3(.94,.61,.39),band?.68:.18);gl_FragColor=vec4(uRing>.5?col:col*light+rim,1.);}'));
 gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
 buffer=gl.createBuffer();normalBuffer=gl.createBuffer();indexBuffer=gl.createBuffer();gl.disable(gl.DITHER);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);build();ready=true;resize();requestAnimationFrame(()=>requestAnimationFrame(resize));
 }catch(e){window.bodyState.error=String(e);fail()}
}
function mesh(p,n,i,id,color){return {p:new Float32Array(p),n:new Float32Array(n),i:new Uint16Array(i),id,color}}
function ellipsoid(cx,cy,cz,rx,ry,rz,tilt,id,color){let p=[],n=[],ix=[],N=32,M=22;const c=Math.cos(tilt),s=Math.sin(tilt);for(let a=0;a<=M;a++){let v=a*Math.PI/M;for(let b=0;b<=N;b++){let u=b*Math.PI*2/N,x=Math.sin(v)*Math.cos(u),y=Math.cos(v),z=Math.sin(v)*Math.sin(u);p.push(cx+c*rx*x-s*ry*y,cy+s*rx*x+c*ry*y,cz+rz*z);let nx=x/rx,ny=y/ry,nz=z/rz,len=Math.hypot(nx,ny,nz);n.push((c*nx-s*ny)/len,(s*nx+c*ny)/len,nz/len);if(a<M&&b<N){let j=a*(N+1)+b;ix.push(j,j+N+1,j+1,j+1,j+N+1,j+N+2)}}}return mesh(p,n,ix,id,color)}
function torso(){let p=[],n=[],ix=[],N=48,M=50;const stations=[[-.28,.255,.19],[-.10,female?.37:.34,.24],[.08,female?.33:.31,.22],[.34,female?.245:.275,.19],[.58,.32,.225],[.79,female?.36:.395,.25],[.98,female?.37:.425,.21],[1.08,.25,.15]];
function radius(y){let k=0;while(k<stations.length-2&&y>stations[k+1][0])k++;let t=Math.max(0,Math.min(1,(y-stations[k][0])/(stations[k+1][0]-stations[k][0])));t=t*t*(3-2*t);return [stations[k][1]*(1-t)+stations[k+1][1]*t,stations[k][2]*(1-t)+stations[k+1][2]*t]}
for(let a=0;a<=M;a++){let y=-.28+1.36*a/M,r=radius(y),ra=radius(y-.003),rb=radius(y+.003),dx=(rb[0]-ra[0])/.006,dz=(rb[1]-ra[1])/.006;for(let b=0;b<=N;b++){let t=b*2*Math.PI/N,c=Math.cos(t),s=Math.sin(t);p.push(r[0]*c,y,r[1]*s);let nx=c/r[0],ny=-(dx*c*c/r[0]+dz*s*s/r[1]),nz=s/r[1],l=Math.hypot(nx,ny,nz);n.push(nx/l,ny/l,nz/l);if(a<M&&b<N){let j=a*(N+1)+b;ix.push(j,j+1,j+N+1,j+1,j+N+2,j+N+1)}}}return mesh(p,n,ix,8,[.62,.69,.79])}
function build(){meshes=[];const skin=[.65,.72,.81];meshes.push(torso());meshes.push(ellipsoid(0,1.18,0,.115,.16,.11,0,6,skin),ellipsoid(0,1.50,.015,.16,.235,.175,0,0,skin),ellipsoid(0,1.49,.175,.028,.043,.035,0,0,skin));for(let side of [-1,1]){
 meshes.push(ellipsoid(side*.40,1.0,0,.145,.16,.15,side*.2,4,skin));
 meshes.push(ellipsoid(side*.53,.76,0,.112,.30,.115,side*.35,4,skin));
 meshes.push(ellipsoid(side*.635,.49,.005,.093,.105,.095,0,0,skin));
 meshes.push(ellipsoid(side*.69,.255,.01,.082,.265,.086,side*.18,0,skin));
 meshes.push(ellipsoid(side*.75,-.015,.025,.075,.13,.055,side*.1,0,skin));
 meshes.push(ellipsoid(side*.177,-.54,0,.162,.43,.18,side*.025,5,skin));
 meshes.push(ellipsoid(side*.193,-.93,.015,.115,.13,.12,0,0,skin));
 meshes.push(ellipsoid(side*.205,-1.22,-.015,.104,.30,.115,side*.015,0,skin));
 meshes.push(ellipsoid(side*.21,-1.53,.09,.115,.085,.22,0,0,skin));}
window.bodyState.triangles=meshes.reduce((sum,m)=>sum+m.i.length/3,0);makeRing();}
function makeRing(){let spec={1:[0,.34,0,female?.255:.285,.201,0],2:[0,-.075,0,female?.377:.35,.25,0],3:[0,.77,0,female?.37:.402,.258,0],4:[-.53,.76,0,.119,.124,-.35],5:[-.177,-.54,0,.168,.189,0],6:[0,1.19,0,.122,.118,0]}[selected];if(!spec){ring=null;return}let [cx,cy,cz,rx,rz,tilt]=spec,p=[],n=[],ix=[],N=96,M=8,c=Math.cos(tilt),s=Math.sin(tilt);for(let a=0;a<=N;a++){let t=a*2*Math.PI/N;for(let b=0;b<=M;b++){let v=b*2*Math.PI/M,nx=Math.cos(t)*Math.cos(v),ny=Math.sin(v),nz=Math.sin(t)*Math.cos(v),x=rx*Math.cos(t)+.012*nx,y=.012*ny,z=rz*Math.sin(t)+.012*nz;p.push(cx+c*x-s*y,cy+s*x+c*y,cz+z);n.push(c*nx-s*ny,s*nx+c*ny,nz);if(a<N&&b<M){let j=a*(M+1)+b;ix.push(j,j+1,j+M+1,j+1,j+M+2,j+M+1)}}}ring=mesh(p,n,ix,0,[.918,.443,.22]);}
function drawMesh(m,pick,isRing){gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,m.p,gl.STATIC_DRAW);let p=gl.getAttribLocation(program,'aP');gl.enableVertexAttribArray(p);gl.vertexAttribPointer(p,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,normalBuffer);gl.bufferData(gl.ARRAY_BUFFER,m.n,gl.STATIC_DRAW);let n=gl.getAttribLocation(program,'aN');gl.enableVertexAttribArray(n);gl.vertexAttribPointer(n,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,indexBuffer);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,m.i,gl.STATIC_DRAW);gl.uniform3fv(gl.getUniformLocation(program,'uColor'),m.color);gl.uniform1f(gl.getUniformLocation(program,'uId'),m.id);gl.uniform1f(gl.getUniformLocation(program,'uRing'),isRing?1:0);gl.drawElements(gl.TRIANGLES,m.i.length,gl.UNSIGNED_SHORT,0)}
function draw(pick=false){if(!ready)return;let d=Math.min(devicePixelRatio||1,2),w=Math.round(canvas.clientWidth*d),h=Math.round(canvas.clientHeight*d);window.bodyState.viewport=[canvas.clientWidth,canvas.clientHeight,innerWidth,innerHeight];if(w<1||h<1)return;if(canvas.width!==w)canvas.width=w;if(canvas.height!==h)canvas.height=h;gl.useProgram(program);gl.viewport(0,0,w,h);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniform1f(gl.getUniformLocation(program,'uYaw'),yaw);gl.uniform1f(gl.getUniformLocation(program,'uAspect'),w/h);gl.uniform1f(gl.getUniformLocation(program,'uPick'),pick?1:0);gl.uniform1f(gl.getUniformLocation(program,'uSelected'),selected);meshes.forEach(m=>drawMesh(m,pick,false));if(!pick&&ring)drawMesh(ring,false,true);window.bodyState.angle=yaw;if(!pick){let pixel=new Uint8Array(4);gl.readPixels(Math.floor(w/2),Math.floor(h*(.5+(.34-.04)/3.72)),1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);window.bodyState.pixel=Array.from(pixel);window.bodyState.glError=gl.getError();let painted=pixel[3]>0&&window.bodyState.glError===0;if(painted&&!window.bodyState.ready){window.bodyState.ready=true;report(true)}}}
function resize(){draw()}
if(window.ResizeObserver)new ResizeObserver(resize).observe(canvas);
function choose(key,notify){let id=keys.indexOf(key);if(id<1)return;selected=id;window.bodyState.selected=key;makeRing();draw();if(notify){try{AndroidBody.selectPart(key)}catch(e){}}}
window.setSelection=key=>choose(key,false);window.setGender=male=>{if(female===!male)return;female=!male;build();draw()};window.rotateTo=angle=>{yaw=angle;draw()};
function pick(x,y){if(!ready)return;draw(true);let px=new Uint8Array(4),r=canvas.getBoundingClientRect(),sx=canvas.width/r.width,sy=canvas.height/r.height;gl.readPixels(Math.floor(x*sx),Math.floor((r.height-y)*sy),1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);window.bodyState.lastPick=Array.from(px);draw();if(px[0]>0&&px[0]<keys.length)choose(keys[px[0]],true)}
let start=null,moved=false;canvas.addEventListener('pointerdown',e=>{window.bodyState.pointer=[e.clientX,e.clientY];start=[e.clientX,e.clientY,yaw];moved=false;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!start)return;let d=e.clientX-start[0];if(Math.abs(d)>5){moved=true;yaw=start[2]+d*.012;draw()}});canvas.addEventListener('pointerup',e=>{if(start&&!moved){let r=canvas.getBoundingClientRect();pick(e.clientX-r.left,e.clientY-r.top)}start=null});canvas.addEventListener('pointercancel',()=>{start=null});
document.getElementById('front').onclick=()=>window.rotateTo(0);document.getElementById('back').onclick=()=>window.rotateTo(Math.PI);window.addEventListener('resize',resize);
// Coordinates exposed for keyboard/accessibility integrations and renderer verification.
window.bodyPoint=key=>{let p={vita:[0,.34,.21],fianchi:[0,-.075,.26],petto:[0,.77,.27],braccio:[-.53,.76,.125],coscia:[-.177,-.54,.20],collo:[0,1.19,.125]}[key];if(!p)return null;let x=Math.cos(yaw)*p[0]+Math.sin(yaw)*p[2];return [canvas.clientWidth*(.5+x/(3.72*canvas.clientWidth/canvas.clientHeight)),canvas.clientHeight*(.5-(p[1]-.04)/3.72)]};
init();
</script></html>
